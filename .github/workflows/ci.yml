name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        quality: [test, typecheck, lint, format, test:e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Configure scratch space
        run: |
          SCRATCH="$RUNNER_TEMP/opencode-pty"
          mkdir -p "$SCRATCH/tmp" "$SCRATCH/node" "$SCRATCH/npm"
          {
            echo "TMPDIR=$SCRATCH/tmp"
            echo "TMP=$SCRATCH/tmp"
            echo "TEMP=$SCRATCH/tmp"
            echo "BUN_TMPDIR=$SCRATCH/tmp"
            echo "NODE_COMPILE_CACHE=$SCRATCH/node"
            echo "npm_config_cache=$SCRATCH/npm"
          } >> "$GITHUB_ENV"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Build
        run: bun build:prod

      - name: Run quality step
        run: bun ${{matrix.quality}}

  dependency-review:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
